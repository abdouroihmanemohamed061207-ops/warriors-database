
name: Publication Warriors Database

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparer la demonstration
        run: |
          mkdir -p publication
          cp -R demo/. publication/
          cp -R images publication/images

      - name: Envoyer les fichiers
        uses: actions/upload-pages-artifact@v3
        with:
          path: publication

      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
